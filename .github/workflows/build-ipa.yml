name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Import source tree (first run only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f project.yml ]; then exit 0; fi
          curl -fL --retry 3 -o src.zip https://aka.doubaocdn.com/s/FG4RgTs0ZC
          echo "3f88d28c5d491f4fa8339c0bdbc8370e985a97fdcea5eb8e939e214c9abe5fe6  src.zip" | shasum -a 256 -c -
          mkdir src
          unzip -q src.zip -d src
          rm -rf src/.github src/README.md
          cp -R src/. .
          rm -rf src src.zip
          cp Tools/build-ipa.yml.template .github/workflows/build-ipa.yml
          rm -rf Tools
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full source tree [skip ci]"
          git push
          gh release delete failed-4 --cleanup-tag --yes || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned app
        run: |
          xcodegen generate
          set -o pipefail
          xcodebuild -project Jianxi.xcodeproj -scheme Jianxi -configuration Release \
            -sdk iphoneos -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R dd/Build/Products/Release-iphoneos/Jianxi.app Payload/
          zip -qry Jianxi-1.0.0-unsigned.ipa Payload

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" Jianxi-1.0.0-unsigned.ipa \
            --title "简洗 iOS build ${GITHUB_RUN_NUMBER}" \
            --notes "未签名 IPA，TrollStore 直接安装；也可用 Sideloadly/AltStore 自签"

      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build.log ]; then
            gh release create "failed-${GITHUB_RUN_NUMBER}" build.log \
              --title "构建失败日志 ${GITHUB_RUN_NUMBER}" \
              --notes "xcodebuild 完整日志"
          fi
