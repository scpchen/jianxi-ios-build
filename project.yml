name: Jianxi
options:
  bundleIdPrefix: dev.rain
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
targets:
  Jianxi:
    type: application
    platform: iOS
    sources:
      - path: Jianxi
        excludes:
          - Info.plist
    info:
      path: Jianxi/Info.plist
      properties:
        CFBundleDisplayName: 简洗
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 扫描设备二维码需要使用相机
        NSPhotoLibraryUsageDescription: 从相册选择二维码图片需要访问照片
        NSLocationWhenInUseUsageDescription: 付款前需要定位，用于确认设备所在位置
        NSLocationTemporaryUsageDescriptionDictionary:
          DeviceLocation: 付款风控需要精确位置确认设备所在位置
        LSApplicationQueriesSchemes:
          - alipay
          - alipays
        CFBundleURLTypes:
          - CFBundleURLName: dev.rain.jianxi
            CFBundleURLSchemes:
              - jianxi
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rain.jianxi
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    scheme:
      testTargets: []
